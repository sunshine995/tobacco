<!-- static/web/editor.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>富文本编辑</title>
  <!-- 引入 wangEditor（轻量、中文友好） -->
  <script src="https://unpkg.com/wangeditor@4.7.11/dist/wangEditor.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #toolbar-container {
      border-bottom: 1px solid #ddd;
      padding: 0 10px;
    }
    #text-container {
      height: calc(100vh - 50px);
      overflow-y: auto;
      padding: 10px;
    }
  </style>
</head>
<body>
  <div id="toolbar-container"></div>
  <div id="text-container"></div>

  <script>
    const E = window.wangEditor;
    const editor = new E('#toolbar-container', '#text-container');

    // 配置
    editor.config.uploadImgShowBase64 = true; // 图片转 base64（适合 App 端）
    editor.config.showLinkImg = false; // 不显示网络图片 tab
    editor.config.uploadImgMaxSize = 5 * 1024 * 1024; // 5MB
    editor.config.uploadImgAccept = ['jpg', 'jpeg', 'png', 'gif'];

    // 监听内容变化，实时通知 App
    editor.config.onchange = (newHtml) => {
      // 通过 uni.postMessage 通知原生页面
      if (window.uni && uni.postMessage) {
        uni.postMessage({
          data: {
            type: 'contentChange',
            html: newHtml
          }
        });
      }
    };

    editor.create();

    // 页面加载完成后通知 App 初始化完成
    document.addEventListener('DOMContentLoaded', () => {
      if (window.uni && uni.postMessage) {
        uni.postMessage({
          data: {
            type: 'ready'
          }
        });
      }
    });

    // 提供获取内容的方法（备用）
    window.getEditorContent = () => {
      return editor.txt.html();
    };
  </script>
</body>
</html>
